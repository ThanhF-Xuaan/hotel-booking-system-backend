spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_db
    username: root
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
#    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  upload:
    dir: ./uploads # Lưu vào thư mục máy tính cá nhân